<svg width="100%" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      <![CDATA[
        .bg { }
        .typing-text {
          font-size: 32px;
          font-weight: bold;
          fill: url(#textGrad);
        }
        .wave {
          font-size: 32px;
          transform-origin: 70% 70%;
          animation: wave 2s ease-in-out infinite;
        }
        @keyframes wave {
          0%, 60%, 100% { transform: rotate(0deg); }
          10%, 30% { transform: rotate(14deg); }
          20% { transform: rotate(-8deg); }
          40% { transform: rotate(-4deg); }
          50% { transform: rotate(10deg); }
        }
        .cursor {
          fill: #58a6ff;
          animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
          0%, 50% { opacity: 1; }
          51%, 100% { opacity: 0; }
        }
        .reveal {
          opacity: 0;
          animation: fadeSlide 0.6s ease forwards;
        }
        .r1 { animation-delay: 0.1s; }
        .r2 { animation-delay: 0.9s; }
        @keyframes fadeSlide {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
      ]]>
    </style>
  </defs>

  <text x="40" y="70" class="typing-text">
    <tspan class="reveal r1">Hello, I'm</tspan>
  </text>

  <text x="195" y="70" class="typing-text reveal r2" fill="#58a6ff">Dede Firdaus</text>

  <text x="420" y="72" class="wave">👋</text>

  <rect x="580" y="45" width="3" height="34" class="cursor"/>
</svg>
