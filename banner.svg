<svg width="100%" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      <![CDATA[
        text {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          font-size: 32px;
          font-weight: bold;
        }
        .plain { fill: #e6edf3; }
        .name { fill: url(#textGrad); }
        .rise {
          opacity: 0;
          animation: riseIn 0.55s ease forwards;
        }
        .w1 { animation-delay: 0.1s; }
        .w2 { animation-delay: 0.45s; }
        .w3 { animation-delay: 0.8s; }
        .w4 {
          animation: riseIn 0.55s ease forwards 1.15s,
                     wave 2s ease-in-out infinite 1.75s;
          transform-origin: 593px 68px;
        }
        @keyframes riseIn {
          from { opacity: 0; transform: translateY(18px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes wave {
          0%, 60%, 100% { transform: rotate(0deg); }
          10%, 30% { transform: rotate(14deg); }
          20% { transform: rotate(-8deg); }
          40% { transform: rotate(-4deg); }
          50% { transform: rotate(10deg); }
        }
      ]]>
    </style>
  </defs>

  <text x="170" y="70" class="plain rise w1">Hello,</text>
  <text x="268" y="70" class="plain rise w2">I'm</text>
  <text x="333" y="70" class="name rise w3">Dede Firdaus</text>
  <text x="571" y="70" class="rise w4">👋</text>
</svg>
